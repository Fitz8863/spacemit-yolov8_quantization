# PASCAL VOC dataset in the repository's flattened YOLO directory layout.
# Usage: yolo detect train data=VOC/VOC.yaml model=yolov8n.pt imgsz=640

# Run Ultralytics from the repository root; paths below resolve to ./VOC.
path: VOC
train: train/images       # 16,551 images: VOC2007 trainval + VOC2012 trainval
val: val/images           # 4,952 images: VOC2007 test
test: val/images

